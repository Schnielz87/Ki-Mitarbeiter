# PORTIVA - Action Contract Registry (ENTWURF)
#
# Abschnitt 36 des UI/UX-Auftrags. Jede sichtbare produktive Aktion steht
# hier mit dem Dienst, der sie wirklich ausfuehrt.
#
# Der Sinn dieser Datei ist nicht Dokumentation, sondern Beweisbarkeit:
# ein Test loest jede Kennung unter "backend_service" auf. Was sich nicht
# aufloesen laesst, laesst den Test fallen. Ein toter Knopf kann damit gar
# nicht erst entstehen (Abschnitt 34).
#
# Zustand je Eintrag:
#   dienst_vorhanden  - der Dienst existiert heute
#   adapter_noetig    - Dienst existiert, braucht eine duenne Anbindung
#   neu               - Fachlogik existiert noch nicht
#
# ENTWURF: die Felder validation / success_result / error_result /
# test_id werden mit der Umsetzung je Aktion gefuellt. Sie hier vorab
# auszufuellen hiesse, Tests zu benennen, die es nicht gibt.

