name: Windows-Build und Tests

# Erzeugt PORTABLE_BUCHHALTER.exe auf einem echten Windows-Rechner.
# Die Entwicklungsumgebung dieses Projekts ist Linux; die EXE entsteht hier.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Ein neuer Stand macht den vorherigen Ablauf gegenstandslos. Ohne diese
# Angabe laufen bei mehreren Pushes hintereinander alle Ablaeufe weiter und
# blockieren einander die Windows-Rechner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Tests
        timeout-minutes: 10
        run: python -m pytest tests -q

  build-windows:
    name: EXE bauen und pruefen (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tkinter vorhanden?
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests auf Windows
        timeout-minutes: 10
        run: python -m pytest tests -q

      - name: Portablen Ordner bauen
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build_windows.ps1 -OhneTests

      - name: EXE existiert wirklich
        shell: pwsh
        run: |
          foreach ($datei in @("PORTABLE_BUCHHALTER.exe", "PORTABLE_BUCHHALTER_KONSOLE.exe")) {
            $pfad = "dist\Portable-Buchhalter\$datei"
            if (-not (Test-Path $pfad)) { throw "$datei wurde nicht erzeugt." }
            $groesse = (Get-Item $pfad).Length
            Write-Host "$datei vorhanden, $([math]::Round($groesse/1MB,1)) MB"
          }

      - name: Systempruefung der gebauten EXE
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          .\PORTABLE_BUCHHALTER_KONSOLE.exe check | Tee-Object -Variable zeilen
          if ($LASTEXITCODE -gt 2) { throw "Die EXE liess sich nicht ausfuehren." }
          # Tee-Object liefert ein Array von Zeilen. "-notmatch" wuerde darauf
          # filtern statt zu pruefen und waere praktisch immer wahr - daher
          # erst zu einem Text zusammenfuegen.
          $ausgabe = $zeilen -join "`n"
          if ($ausgabe -notmatch "Systempruefung") { throw "Unerwartete Ausgabe der EXE." }
          if ($ausgabe -notmatch "Fachwissen") { throw "Das Fachwissen wurde nicht aufgenommen." }

      - name: Branding liegt neben der EXE und wird gefunden
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          # Die Dateien muessen NEBEN der EXE liegen, nicht in _internal:
          # die Anwendung loest ihre Pfade von der portablen Wurzel aus auf,
          # und der Betreiber soll das Logo austauschen koennen, ohne neu zu
          # bauen. Genau das war einmal falsch - das Paket enthielt das Logo,
          # die Anwendung fand es trotzdem nicht.
          foreach ($datei in @("assets\branding\portiva_icon.ico",
                               "assets\branding\portiva_icon.png",
                               "assets\branding\portiva_logo_primary.png",
                               "config\brand.json")) {
            if (-not (Test-Path $datei)) { throw "Branding fehlt im Paket: $datei" }
            Write-Host "vorhanden: $datei ($((Get-Item $datei).Length) Bytes)"
          }
          # ... und die Anwendung muss sie auch wirklich finden.
          $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe check
          $ausgabe = $zeilen -join "`n"
          if ($ausgabe -notmatch "PORTIVA") { throw "Die Marke PORTIVA fehlt in der Ausgabe." }
          $branding = $zeilen | Where-Object { $_ -match "Branding" }
          Write-Host "Pruefzeile: $branding"
          if ($branding -match "fehlen") { throw "Die Anwendung findet ihr Branding nicht: $branding" }

      - name: Offline-Fachfrage gegen die gebaute EXE
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          $antwort = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline frage "Welche Pflichtangaben muss eine Rechnung enthalten?" | Out-String
          Write-Host $antwort
          if ($antwort -notmatch "QUELLEN") { throw "Die Antwort enthielt keinen Quellenteil." }
          if ($antwort -notmatch "Rechnung") { throw "Die lokale Recherche lieferte nichts Passendes." }

      - name: Unternehmenswissen speichern und nach Neustart lesen
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          Write-Host "--- speichern (eigener Programmlauf) ---"
          .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen set company.chart_of_accounts "Das Unternehmen verwendet SKR03." --titel Kontenrahmen --kategorie accounting
          if ($LASTEXITCODE -ne 0) { throw "Das Speichern schlug fehl (Code $LASTEXITCODE)." }

          Write-Host "--- Datenbank auf der Platte ---"
          Get-ChildItem database -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host

          Write-Host "--- lesen (neuer Programmlauf) ---"
          $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen get company.chart_of_accounts
          $code = $LASTEXITCODE
          $wert = ($zeilen -join "`n")
          Write-Host "Rueckgabe (Code $code): '$wert'"

          if ($code -ne 0) { throw "Das Lesen schlug fehl (Code $code)." }
          if ($wert -notmatch "SKR03") {
            Write-Host "--- zur Fehlersuche: gesamter Bestand ---"
            .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen list | Out-String | Write-Host
            .\PORTABLE_BUCHHALTER_KONSOLE.exe status | Out-String | Write-Host
            throw "Das Unternehmenswissen wurde nicht dauerhaft gespeichert."
          }

      - name: Portabilitaet - anderes Laufwerk, Pfad mit Leerzeichen
        shell: pwsh
        run: |
          # Ein anderer Laufwerksbuchstabe wird ueber subst simuliert.
          $ziel = "$env:RUNNER_TEMP\Zweiter PC\Portable Buchhalter"
          New-Item -ItemType Directory -Force -Path $ziel | Out-Null
          Copy-Item "dist\Portable-Buchhalter\*" -Destination $ziel -Recurse -Force
          subst X: "$env:RUNNER_TEMP\Zweiter PC"
          try {
            Set-Location "X:\Portable Buchhalter"
            $wert = .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen get company.chart_of_accounts | Out-String
            Write-Host "Auf X: gelesen: $wert"
            if ($wert -notmatch "SKR03") {
              throw "Nach Laufwerkswechsel war das Unternehmenswissen nicht verfuegbar."
            }
            .\PORTABLE_BUCHHALTER_KONSOLE.exe check
            if ($LASTEXITCODE -gt 2) { throw "Auf dem anderen Laufwerk startete die EXE nicht." }
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            subst X: /D
          }

      - name: Dateien erzeugen - Excel, Word, PowerPoint, PDF (Erweiterung E4)
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline frage "Wie lange muss ich Rechnungen aufbewahren?" | Out-Null
          foreach ($format in @("xlsx", "docx", "pptx", "pdf", "csv")) {
            $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format $format --name Windowsprobe
            if ($LASTEXITCODE -ne 0) { throw "Die $format-Datei wurde nicht erzeugt (Code $LASTEXITCODE)." }
            Write-Host ($zeilen -join "`n")
          }
          $ordner = "workspace\artefakte"
          Get-ChildItem $ordner | Format-Table Name, Length | Out-String | Write-Host
          foreach ($endung in @("xlsx", "docx", "pptx", "pdf", "csv")) {
            $datei = Join-Path $ordner "Windowsprobe.$endung"
            if (-not (Test-Path $datei)) { throw "Es fehlt: $datei" }
            if ((Get-Item $datei).Length -lt 200) { throw "$datei ist verdaechtig klein." }
          }
          # Zweites Speichern darf die erste Fassung nicht ueberschreiben.
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format pdf --name Windowsprobe | Out-Null
          if (-not (Test-Path (Join-Path $ordner "Windowsprobe_v2.pdf"))) {
            throw "Beim zweiten Speichern entstand keine neue Fassung."
          }

      - name: Plugin installieren und aktivieren (Erweiterung E5)
        shell: pwsh
        run: |
          python tools\plugin_packen.py examples\plugin_html --ziel "$env:RUNNER_TEMP\html_export"
          Set-Location dist\Portable-Buchhalter
          $paket = "$env:RUNNER_TEMP\html_export.kimplug"

          # Ohne Bestaetigung darf nichts installiert werden.
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline plugin installieren $paket | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { throw "Das Plugin wurde ohne Bestaetigung installiert." }

          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline plugin installieren $paket --bestaetigen --aktivieren
          if ($LASTEXITCODE -ne 0) { throw "Die Installation schlug fehl (Code $LASTEXITCODE)." }

          $formate = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei formate | Out-String
          Write-Host $formate
          if ($formate -notmatch "html") { throw "Das Plugin hat sein Format nicht angemeldet." }

          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format html --name Pluginprobe
          if (-not (Test-Path "workspace\artefakte\Pluginprobe.html")) {
            throw "Die HTML-Datei aus dem Plugin wurde nicht erzeugt."
          }

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Buchhalter-Windows
          path: dist/Portable-Buchhalter/
          retention-days: 30
