name: Windows-Build und Tests

# Erzeugt PORTABLE_BUCHHALTER.exe auf einem echten Windows-Rechner.
# Die Entwicklungsumgebung dieses Projekts ist Linux; die EXE entsteht hier.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Ein neuer Stand macht den vorherigen Ablauf gegenstandslos. Ohne diese
# Angabe laufen bei mehreren Pushes hintereinander alle Ablaeufe weiter und
# blockieren einander die Windows-Rechner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Tests
        timeout-minutes: 10
        run: python -m pytest tests -q

  build-windows:
    name: EXE bauen und pruefen (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tkinter vorhanden?
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests auf Windows
        timeout-minutes: 10
        run: python -m pytest tests -q

      - name: Modelldienst llama.cpp besorgen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Die fertige Programmdatei aus dem offiziellen Projekt. Fuer
          # llama-cpp-python gibt es keine fertigen Pakete - der Kunde
          # muesste uebersetzen, was fuer eine portable Anwendung ausscheidet.
          # Nicht "releases/latest" nehmen: dort steht bei llama.cpp eine
          # Marke ohne Programmdateien (beobachtet: v0.4.0 mit nur einer
          # Textdatei). Die Programmdateien liegen in den fortlaufenden
          # Veroeffentlichungen. Also die neueste nehmen, die wirklich eine
          # Windows-Datei enthaelt.
          $api = "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30"
          $releases = Invoke-RestMethod -Uri $api -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent"  = "PORTIVA-Bauablauf"
          }
          $muster = @("*bin-win-cpu-x64.zip", "*bin-win-avx2-x64.zip",
                      "*bin-win-cpu*.zip", "*win-x64.zip")
          $release = $null
          $paket = $null
          foreach ($kandidat in $releases) {
            foreach ($m in $muster) {
              $treffer = $kandidat.assets | Where-Object { $_.name -like $m } |
                         Select-Object -First 1
              if ($treffer) { $release = $kandidat; $paket = $treffer; break }
            }
            if ($paket) { break }
          }
          if (-not $paket) {
            Write-Host "Durchsuchte Veroeffentlichungen:"
            $releases | Select-Object -First 5 | ForEach-Object {
              Write-Host "  $($_.tag_name): $(($_.assets | ForEach-Object { $_.name }) -join ', ')"
            }
            throw "Keine Veroeffentlichung mit einer Windows-Programmdatei gefunden."
          }
          Write-Host "llama.cpp Fassung: $($release.tag_name)"
          Write-Host "Paket: $($paket.name) ($([math]::Round($paket.size/1MB,1)) MB)"
          Invoke-WebRequest -Uri $paket.browser_download_url -OutFile "$env:RUNNER_TEMP\llama.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama.zip" -DestinationPath "$env:RUNNER_TEMP\llama" -Force

          New-Item -ItemType Directory -Force -Path "runtime\llama" | Out-Null
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama" -Recurse -Filter "llama-server.exe" |
                    Select-Object -First 1
          if (-not $server) { throw "llama-server.exe fehlt im heruntergeladenen Paket." }
          Copy-Item "$($server.Directory.FullName)\*" -Destination "runtime\llama" -Recurse -Force
          "llama.cpp $($release.tag_name), MIT-Lizenz, bezogen am $(Get-Date -Format 'yyyy-MM-dd')" |
            Set-Content "runtime\llama\HERKUNFT.txt"
          Get-ChildItem "runtime\llama" | Select-Object Name, Length |
            Format-Table | Out-String | Write-Host

      - name: Portablen Ordner bauen
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build_windows.ps1 -OhneTests

      - name: EXE existiert wirklich
        shell: pwsh
        run: |
          foreach ($datei in @("PORTABLE_BUCHHALTER.exe", "PORTABLE_BUCHHALTER_KONSOLE.exe")) {
            $pfad = "dist\Portable-Buchhalter\$datei"
            if (-not (Test-Path $pfad)) { throw "$datei wurde nicht erzeugt." }
            $groesse = (Get-Item $pfad).Length
            Write-Host "$datei vorhanden, $([math]::Round($groesse/1MB,1)) MB"
          }

      - name: Systempruefung der gebauten EXE
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          .\PORTABLE_BUCHHALTER_KONSOLE.exe check | Tee-Object -Variable zeilen
          if ($LASTEXITCODE -gt 2) { throw "Die EXE liess sich nicht ausfuehren." }
          # Tee-Object liefert ein Array von Zeilen. "-notmatch" wuerde darauf
          # filtern statt zu pruefen und waere praktisch immer wahr - daher
          # erst zu einem Text zusammenfuegen.
          $ausgabe = $zeilen -join "`n"
          if ($ausgabe -notmatch "Systempruefung") { throw "Unerwartete Ausgabe der EXE." }
          if ($ausgabe -notmatch "Fachwissen") { throw "Das Fachwissen wurde nicht aufgenommen." }

      - name: Branding liegt neben der EXE und wird gefunden
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          # Die Dateien muessen NEBEN der EXE liegen, nicht in _internal:
          # die Anwendung loest ihre Pfade von der portablen Wurzel aus auf,
          # und der Betreiber soll das Logo austauschen koennen, ohne neu zu
          # bauen. Genau das war einmal falsch - das Paket enthielt das Logo,
          # die Anwendung fand es trotzdem nicht.
          foreach ($datei in @("assets\branding\portiva_icon.ico",
                               "assets\branding\portiva_icon.png",
                               "assets\branding\portiva_logo_primary.png",
                               "config\brand.json")) {
            if (-not (Test-Path $datei)) { throw "Branding fehlt im Paket: $datei" }
            Write-Host "vorhanden: $datei ($((Get-Item $datei).Length) Bytes)"
          }
          # ... und die Anwendung muss sie auch wirklich finden.
          $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe check
          $ausgabe = $zeilen -join "`n"
          if ($ausgabe -notmatch "PORTIVA") { throw "Die Marke PORTIVA fehlt in der Ausgabe." }
          $branding = $zeilen | Where-Object { $_ -match "Branding" }
          Write-Host "Pruefzeile: $branding"
          if ($branding -match "fehlen") { throw "Die Anwendung findet ihr Branding nicht: $branding" }

      - name: Offline-Fachfrage gegen die gebaute EXE
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          $antwort = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline frage "Welche Pflichtangaben muss eine Rechnung enthalten?" | Out-String
          Write-Host $antwort
          if ($antwort -notmatch "QUELLEN") { throw "Die Antwort enthielt keinen Quellenteil." }
          if ($antwort -notmatch "Rechnung") { throw "Die lokale Recherche lieferte nichts Passendes." }

      - name: Unternehmenswissen speichern und nach Neustart lesen
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          Write-Host "--- speichern (eigener Programmlauf) ---"
          .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen set company.chart_of_accounts "Das Unternehmen verwendet SKR03." --titel Kontenrahmen --kategorie accounting
          if ($LASTEXITCODE -ne 0) { throw "Das Speichern schlug fehl (Code $LASTEXITCODE)." }

          Write-Host "--- Datenbank auf der Platte ---"
          Get-ChildItem database -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host

          Write-Host "--- lesen (neuer Programmlauf) ---"
          $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen get company.chart_of_accounts
          $code = $LASTEXITCODE
          $wert = ($zeilen -join "`n")
          Write-Host "Rueckgabe (Code $code): '$wert'"

          if ($code -ne 0) { throw "Das Lesen schlug fehl (Code $code)." }
          if ($wert -notmatch "SKR03") {
            Write-Host "--- zur Fehlersuche: gesamter Bestand ---"
            .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen list | Out-String | Write-Host
            .\PORTABLE_BUCHHALTER_KONSOLE.exe status | Out-String | Write-Host
            throw "Das Unternehmenswissen wurde nicht dauerhaft gespeichert."
          }

      - name: Portabilitaet - anderes Laufwerk, Pfad mit Leerzeichen
        shell: pwsh
        run: |
          # Ein anderer Laufwerksbuchstabe wird ueber subst simuliert.
          $ziel = "$env:RUNNER_TEMP\Zweiter PC\Portable Buchhalter"
          New-Item -ItemType Directory -Force -Path $ziel | Out-Null
          Copy-Item "dist\Portable-Buchhalter\*" -Destination $ziel -Recurse -Force
          subst X: "$env:RUNNER_TEMP\Zweiter PC"
          try {
            Set-Location "X:\Portable Buchhalter"
            $wert = .\PORTABLE_BUCHHALTER_KONSOLE.exe wissen get company.chart_of_accounts | Out-String
            Write-Host "Auf X: gelesen: $wert"
            if ($wert -notmatch "SKR03") {
              throw "Nach Laufwerkswechsel war das Unternehmenswissen nicht verfuegbar."
            }
            .\PORTABLE_BUCHHALTER_KONSOLE.exe check
            if ($LASTEXITCODE -gt 2) { throw "Auf dem anderen Laufwerk startete die EXE nicht." }
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            subst X: /D
          }

      - name: Bezugsquellen der Modelle pruefen
        shell: pwsh
        run: |
          # Der Katalog behauptet nichts - hier wird jede Adresse tatsaechlich
          # abgerufen. Was nicht antwortet, wird nicht als geprueft vermerkt.
          # Grosse Modelle liegen bei Hugging Face oft in Teilen vor
          # (...-00001-of-0000N.gguf). Deshalb wird nicht nur die
          # hinterlegte Adresse geprueft, sondern bei einem 404 auch nach
          # den Teildateien gesucht. Was gefunden wird, steht im Bericht -
          # geraten wird nichts.
          function Pruefe($adresse) {
            try {
              $antwort = Invoke-WebRequest -Uri $adresse -Method Head `
                         -MaximumRedirection 5 -TimeoutSec 60
              return @{ ok = $true; groesse = [int64]$antwort.Headers["Content-Length"][0] }
            } catch {
              return @{ ok = $false; fehler = $_.Exception.Message }
            }
          }

          $katalog = Get-Content "config\model_catalog.json" -Raw | ConvertFrom-Json
          $heute = Get-Date -Format "yyyy-MM-dd"
          $ergebnisse = @()
          foreach ($modell in $katalog.modelle) {
            $zeile = [ordered]@{ id = $modell.id; url = $modell.url }
            $treffer = Pruefe $modell.url
            if ($treffer.ok) {
              $zeile.erreichbar = $true
              $zeile.groesse_bytes = $treffer.groesse
              $zeile.geprueft_am = $heute
              Write-Host ("OK      {0,-16} {1,8:N2} GB" -f $modell.id, ($treffer.groesse/1GB))
            } else {
              # Nach Teildateien suchen
              $teile = @()
              $gesamt = 0
              foreach ($anzahl in 2..8) {
                $teile = @()
                $gesamt = 0
                $vollstaendig = $true
                foreach ($nummer in 1..$anzahl) {
                  $kandidat = $modell.url -replace "\.gguf$",
                    ("-{0:d5}-of-{1:d5}.gguf" -f $nummer, $anzahl)
                  $t = Pruefe $kandidat
                  if (-not $t.ok) { $vollstaendig = $false; break }
                  $teile += $kandidat
                  $gesamt += $t.groesse
                }
                if ($vollstaendig) { break } else { $teile = @() }
              }
              if ($teile.Count -gt 0) {
                $zeile.erreichbar = $true
                $zeile.geteilt = $true
                $zeile.teile = $teile
                $zeile.groesse_bytes = $gesamt
                $zeile.geprueft_am = $heute
                Write-Host ("GETEILT {0,-16} {1,8:N2} GB in {2} Teilen" -f `
                            $modell.id, ($gesamt/1GB), $teile.Count)
                $teile | ForEach-Object { Write-Host "        $_" }
              } else {
                $zeile.erreichbar = $false
                $zeile.fehler = $treffer.fehler
                Write-Host ("FEHLER  {0,-16} {1}" -f $modell.id, $treffer.fehler)
              }
            }
            $ergebnisse += [pscustomobject]$zeile
          }
          $ergebnisse | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\quellenpruefung.json"

          # Der Bau wird nur angehalten, wenn das Modell fehlt, mit dem
          # gleich die Probe laeuft. Eine einzelne unerreichbare Quelle ist
          # ein Registerproblem und wird berichtet, nicht verschwiegen.
          $probe = $ergebnisse | Where-Object { $_.id -eq "qwen2.5-0.5b" }
          if (-not $probe.erreichbar) {
            throw "Das Probemodell ist nicht erreichbar - die Modellprobe kann nicht laufen."
          }
          $fehlend = $ergebnisse | Where-Object { -not $_.erreichbar }
          if ($fehlend) {
            Write-Host "::warning::Nicht erreichbare Bezugsquellen: $(($fehlend | ForEach-Object { $_.id }) -join ', ')"
          }

      - name: Sprachmodell - beziehen, starten, antworten lassen
        shell: pwsh
        timeout-minutes: 15
        run: |
          Set-Location dist\Portable-Buchhalter
          Write-Host "--- Lage vor dem Einrichten ---"
          .\PORTABLE_BUCHHALTER_KONSOLE.exe modell status | Out-String | Write-Host

          Write-Host "--- Ohne Bestaetigung darf nichts geladen werden ---"
          .\PORTABLE_BUCHHALTER_KONSOLE.exe modell einrichten --profil probe | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { throw "Es wurde ohne Bestaetigung geladen." }

          Write-Host "--- Modell beziehen und einrichten ---"
          $ausgabe = .\PORTABLE_BUCHHALTER_KONSOLE.exe modell einrichten --profil probe --bestaetigen | Out-String
          Write-Host $ausgabe
          if ($LASTEXITCODE -ne 0) { throw "Das Einrichten des Modells schlug fehl." }
          if ($ausgabe -notmatch "einsatzbereit") { throw "Das Modell hat nicht geantwortet." }

          $summe = ($ausgabe -split "`n" | Where-Object { $_ -match "SHA-256" }) -join ""
          Write-Host "Pruefsumme des bezogenen Modells: $summe"
          $summe | Set-Content "$env:RUNNER_TEMP\modell_pruefsumme.txt"

          Write-Host "--- Eine echte Fachfrage, mit Modell ---"
          $antwort = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline frage "Was besagt Paragraf 14 UStG in einem Satz?" | Out-String
          Write-Host $antwort
          if ($antwort -match "Es konnte keine KI-Antwort erzeugt werden") {
            throw "Die Anwendung lief trotz vorhandenem Modell im Notbetrieb."
          }
          if ($antwort -notmatch "WISSENSSTAND") { throw "Der Antwort fehlt der Wissensstand." }
          if ($antwort -notmatch "kein Sprachmodell verfuegbar") {
            Write-Host "Bestaetigt: die Antwort stammt vom Sprachmodell."
          } else {
            throw "Der Wissensstand meldet weiterhin 'kein Sprachmodell verfuegbar'."
          }

          Write-Host "--- Laeuft der Dienst nach dem Programmende noch? ---"
          $rest = Get-Process llama-server -ErrorAction SilentlyContinue
          if ($rest) { throw "Der Modelldienst laeuft nach dem Programmende weiter." }
          Write-Host "Kein verwaister Vorgang - in Ordnung."

      - name: Quellenregister gegen die echten Adressen pruefen
        shell: pwsh
        continue-on-error: true
        # Bewusst NACH der Modellprobe: hier wird wirklich geladen, und
        # amtliche Server sind manchmal langsam. Liefe die Pruefung davor,
        # koennte sie im schlechten Fall die Zeit des Auftrags aufbrauchen -
        # und ausgerechnet der wichtigste Schritt fiele aus.
        timeout-minutes: 10
        run: |
          # In der Entwicklungsumgebung sind die amtlichen Server gesperrt;
          # hier nicht. Geprueft wird mit dem HTTP-Zugriff der Anwendung
          # selbst - nicht mit einem fremden Werkzeug. Sonst wuerde der
          # Bauablauf etwas bestaetigen, das die Anwendung so gar nicht tut
          # (eigenes Nutzerkennzeichen, eigener Zertifikatsspeicher,
          # robots.txt, Wiederholungen, GET statt HEAD).
          # Einzelne Ausfaelle sind normal (Umbauten, Sperren gegen
          # automatische Abrufe) und duerfen den Bau nicht anhalten - das
          # Ergebnis wird berichtet, nicht behauptet.
          python tools\quellen_pruefen.py `
            --register config\source_registry.json `
            --ziel "$env:RUNNER_TEMP\quellenregister_pruefung.json"

      - name: Pruefergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modellpruefung
          path: |
            ${{ runner.temp }}/quellenpruefung.json
            ${{ runner.temp }}/quellenregister_pruefung.json
            ${{ runner.temp }}/modell_pruefsumme.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Dateien erzeugen - Excel, Word, PowerPoint, PDF (Erweiterung E4)
        shell: pwsh
        run: |
          Set-Location dist\Portable-Buchhalter
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline frage "Wie lange muss ich Rechnungen aufbewahren?" | Out-Null
          foreach ($format in @("xlsx", "docx", "pptx", "pdf", "csv")) {
            $zeilen = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format $format --name Windowsprobe
            if ($LASTEXITCODE -ne 0) { throw "Die $format-Datei wurde nicht erzeugt (Code $LASTEXITCODE)." }
            Write-Host ($zeilen -join "`n")
          }
          $ordner = "workspace\artefakte"
          Get-ChildItem $ordner | Format-Table Name, Length | Out-String | Write-Host
          foreach ($endung in @("xlsx", "docx", "pptx", "pdf", "csv")) {
            $datei = Join-Path $ordner "Windowsprobe.$endung"
            if (-not (Test-Path $datei)) { throw "Es fehlt: $datei" }
            if ((Get-Item $datei).Length -lt 200) { throw "$datei ist verdaechtig klein." }
          }
          # Zweites Speichern darf die erste Fassung nicht ueberschreiben.
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format pdf --name Windowsprobe | Out-Null
          if (-not (Test-Path (Join-Path $ordner "Windowsprobe_v2.pdf"))) {
            throw "Beim zweiten Speichern entstand keine neue Fassung."
          }

      - name: Plugin installieren und aktivieren (Erweiterung E5)
        shell: pwsh
        run: |
          python tools\plugin_packen.py examples\plugin_html --ziel "$env:RUNNER_TEMP\html_export"
          Set-Location dist\Portable-Buchhalter
          $paket = "$env:RUNNER_TEMP\html_export.kimplug"

          # Ohne Bestaetigung darf nichts installiert werden.
          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline plugin installieren $paket | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { throw "Das Plugin wurde ohne Bestaetigung installiert." }

          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline plugin installieren $paket --bestaetigen --aktivieren
          if ($LASTEXITCODE -ne 0) { throw "Die Installation schlug fehl (Code $LASTEXITCODE)." }

          $formate = .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei formate | Out-String
          Write-Host $formate
          if ($formate -notmatch "html") { throw "Das Plugin hat sein Format nicht angemeldet." }

          .\PORTABLE_BUCHHALTER_KONSOLE.exe --offline datei antwort --format html --name Pluginprobe
          if (-not (Test-Path "workspace\artefakte\Pluginprobe.html")) {
            throw "Die HTML-Datei aus dem Plugin wurde nicht erzeugt."
          }

      - name: Bezogenes Modell wieder entfernen
        shell: pwsh
        run: |
          # Das Modell gehoert nicht ins Auslieferungspaket: es ist mehrere
          # Gigabyte gross, und seine Lizenz waehlt der Betreiber selbst aus.
          Remove-Item "dist\Portable-Buchhalter\models\*.gguf" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "dist\Portable-Buchhalter\models" -ErrorAction SilentlyContinue |
            Format-Table Name, Length | Out-String | Write-Host

      - name: Pruefergebnisse zum Nachlesen ausgeben
        if: always()
        shell: pwsh
        run: |
          # Am Ende noch einmal im Klartext: so stehen die tatsaechlich
          # gepruefte Adresse und die gebildete Pruefsumme dort, wo man sie
          # sucht - im Protokoll des Laufs, nicht nur in einer Anlage.
          foreach ($datei in @("quellenpruefung.json", "modell_pruefsumme.txt")) {
            $pfad = Join-Path $env:RUNNER_TEMP $datei
            if (Test-Path $pfad) {
              Write-Host "----- $datei -----"
              Get-Content $pfad -Raw | Write-Host
            }
          }
          $register = Join-Path $env:RUNNER_TEMP "quellenregister_pruefung.json"
          if (Test-Path $register) {
            Write-Host "----- Quellenregister: nicht erreichbare Adressen -----"
            (Get-Content $register -Raw | ConvertFrom-Json) |
              Where-Object { -not $_.erreichbar } |
              Format-Table quelle, dokument, status, fehler | Out-String -Width 200 | Write-Host
          }

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Buchhalter-Windows
          path: dist/Portable-Buchhalter/
          retention-days: 30
